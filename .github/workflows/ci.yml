name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Version comes from package.json's packageManager field.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # live.smoke.test.ts skips itself: CI has no KEEPER_KSM_CONFIG.
      - run: pnpm test
      - run: pnpm build
      - name: Show the files a release would ship
        run: npm pack --dry-run

  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Two overlapping runs would both compute the same next version and race to tag it.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          # semantic-release reads every commit since the last tag to pick the next version.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Stamps the version into package.json in the runner only (never committed), packs into
      # release/, tags, and attaches the tarball to the GitHub release.
      - run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # No tarball means the pushed commits did not warrant a release. Attestations on a private
      # repo need GitHub Enterprise Cloud, so this starts running once the repo is public.
      - if: hashFiles('release/*.tgz') != '' && !github.event.repository.private
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/*.tgz
